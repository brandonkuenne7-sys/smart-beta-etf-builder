name: Inspect EDGAR outliers (temporary)
on:
  push:
    branches: [pit-universe]
    paths: [".github/workflows/inspect_tmp.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -q pandas==2.3.3 numpy==2.0.2
      - env: { SEC_CONTACT_EMAIL: "${{ secrets.SEC_CONTACT_EMAIL }}" }
        run: python scripts/inspect_edgar.py SNDK WDC MU --as-of 2026-10-30
