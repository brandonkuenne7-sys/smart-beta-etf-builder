name: Probe SEC EDGAR (temporary)
on:
  push:
    branches: [pit-universe]
    paths: [".github/workflows/probe_sec.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          UA="smart-beta-etf-builder research ${SEC_CONTACT_EMAIL}"
          curl -sS -o t.json -w "tickers %{http_code} %{size_download}\n" -A "$UA" https://www.sec.gov/files/company_tickers.json
          for c in 0000320193 0001652044 0001067983 0000019617 0001326801; do
            curl -sS --compressed -o f_$c.json -w "facts $c %{http_code} %{size_download}\n" -A "$UA" https://data.sec.gov/api/xbrl/companyfacts/CIK$c.json; sleep 0.2
          done
          python3 - <<'PY'
          import json, glob
          t=json.load(open('t.json')); print('tickers', len(t), [ (v['ticker'],v['cik_str']) for v in t.values() if v['ticker'] in ('BRK-B','GOOGL','META','JPM')])
          tags={'us-gaap':['NetIncomeLoss','ProfitLoss','Revenues','RevenueFromContractWithCustomerExcludingAssessedTax','SalesRevenueNet','StockholdersEquity','StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest','Liabilities','LiabilitiesAndStockholdersEquity','WeightedAverageNumberOfDilutedSharesOutstanding','CommonStockSharesOutstanding','EarningsPerShareDiluted'],'dei':['EntityCommonStockSharesOutstanding']}
          for f in sorted(glob.glob('f_*.json')):
              g=json.load(open(f)); print('==', g.get('entityName'))
              for ns, ts in tags.items():
                  for tg in ts:
                      u=g['facts'].get(ns,{}).get(tg,{}).get('units',{})
                      for unit, xs in u.items():
                          fy=[x for x in xs if x.get('form')=='10-K' and x.get('fp')=='FY']
                          print(f"  {tg:70} {unit:10} n={len(xs):4} 10K={len(fy):3} last={xs[-1]}")
              sh=g['facts'].get('dei',{}).get('EntityCommonStockSharesOutstanding',{}).get('units',{}).get('shares',[])
              print('  last dei shares rows:', sh[-3:])
          PY
