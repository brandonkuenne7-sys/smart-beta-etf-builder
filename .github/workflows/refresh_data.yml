# =============================================================================
# Monthly data refresh → PythonAnywhere
#
# PythonAnywhere's free tier can't reach Yahoo Finance, so the data is rebuilt
# here on GitHub's servers and pushed INTO PythonAnywhere:
#
#   1. Rebuild pipeline_cache.json through the last completed month
#   2. Validate it (validate_cache.py) — on failure, stop; the site keeps
#      last month's data and GitHub emails you
#   3. Commit it, plus a gzipped monthly snapshot in history/
#   4. Upload it to PythonAnywhere via their API and reload the site
#   5. Confirm the live site is serving the new data
#
# Setup: add a repository secret named PA_API_TOKEN (PythonAnywhere →
# Account → API Token). Until it exists, steps 1–3 still run and deploy is
# skipped with a warning.
#
# Manual run: Actions tab → "Monthly data refresh" → Run workflow.
# =============================================================================

name: Monthly data refresh

on:
  schedule:
    # 13:17 UTC on the 3rd of each month — after month-end prices settle.
    - cron: "17 13 3 * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Upload to PythonAnywhere and reload the site"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PA_USER: brandonkuenne7
  PA_DOMAIN: brandonkuenne7.pythonanywhere.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-refresh.txt

      - name: Install research stack
        run: pip install -r requirements-refresh.txt

      - name: Rebuild cache (up to 3 attempts — Yahoo sometimes rate-limits)
        run: |
          for attempt in 1 2 3; do
            if python precompute_cache.py --output /tmp/new_cache.json; then exit 0; fi
            echo "Attempt $attempt failed; retrying after a pause"
            sleep $((attempt * 120))
          done
          exit 1

      - name: Validate before publishing
        run: python validate_cache.py /tmp/new_cache.json --previous pipeline_cache.json

      - name: Diagnostics (only shown when something fails)
        if: failure()
        run: |
          echo "--- fundamentals snapshot ---"; cat /tmp/fundamentals_snapshot.csv || true
          echo "--- pandas_datareader import ---"; python -c "import pandas_datareader.data" || true
          echo "--- yfinance .info sample ---"
          python -c "import yfinance as yf; i=yf.Ticker('AAPL').info; print(yf.__version__, len(i), {k: i.get(k) for k in ('trailingPE','priceToBook','returnOnEquity','debtToEquity','profitMargins')})" || true

      - name: Commit cache and monthly snapshot
        run: |
          cp /tmp/new_cache.json pipeline_cache.json
          month=$(python -c "import json; print(json.load(open('pipeline_cache.json'))['data_through'][:7])")
          mkdir -p history
          gzip -9 -n -c pipeline_cache.json > "history/pipeline_cache_${month}.json.gz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline_cache.json history/
          git diff --staged --quiet || git commit -m "Data refresh through ${month}"
          git push

      - name: Deploy to PythonAnywhere and confirm
        if: github.event_name == 'schedule' || inputs.deploy
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          if [ -z "$PA_API_TOKEN" ]; then
            echo "::warning::PA_API_TOKEN secret not set — skipping deploy. Data is committed to the repo."
            exit 0
          fi
          api="https://www.pythonanywhere.com/api/v0/user/${PA_USER}"

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            -F "content=@pipeline_cache.json" \
            "${api}/files/path/home/${PA_USER}/mysite/pipeline_cache.json"

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "${api}/webapps/${PA_DOMAIN}/reload/"

          expected=$(python -c "import json; print(json.load(open('pipeline_cache.json'))['generated_at'])")
          for i in 1 2 3 4 5 6; do
            if curl -sS "https://${PA_DOMAIN}/_dash-layout" | grep -qF "$expected"; then
              echo "Live site is serving data generated at ${expected}"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Uploaded and reloaded, but the live site isn't showing the new data yet"
          exit 1
